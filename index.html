<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Clock Widget</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tiny5&display=swap" rel="stylesheet"> 
</head>
<body>
  <div class="neon-card" id="neonCard" data-theme="dark">
    <!-- Холст для неонового дождя/частиц -->
    <canvas id="neon-particles"></canvas>
    
    <div class="btn-controls">
      <!-- Переключатель темы (dark / light / neon) -->
      <button class="hiden-btn" id="theme-toggle" aria-label="Сменить тему" title="Сменить тему">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
      
      <div class="btn-divider"></div>      
      
      <!-- Переключатель секунд -->
      <button class="hiden-btn" id="seconds-toggle" aria-label="Показать/скрыть секунды" title="Показать/скрыть секунды">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>

    <!-- Основной контент -->
    <div class="content">
      <div class="time-display">
        <span class="time-unit hours" id="hours">00</span>
        <span class="time-separator">:</span>
        <span class="time-unit minutes" id="minutes">00</span>
        <span class="time-unit seconds" id="seconds">:00</span>
      </div>
      <div class="date-display" id="date">Понедельник, 5 октября</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
